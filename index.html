<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ALIBI — Contemporary Fashion House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#F7F6F2;
  --white:#FFFFFF;
  --black:#111111;
  --gray:#777777;
  --light-gray:#E5E3DE;
  --line: rgba(17,17,17,.12);
  --serif:'Libre Bodoni', serif;
  --sans:'Manrope', sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --header-h:74px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--black);
  font-family:var(--sans);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%;}
button{font-family:inherit;font-size:inherit;text-align:inherit;cursor:pointer;background:none;border:none;color:inherit;}
a{color:inherit;text-decoration:none;}
input,select{font-family:inherit;}
::selection{background:var(--black);color:var(--white);}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--black);outline-offset:3px;
}

.wrap{max-width:1440px;margin:0 auto;padding:0 48px;}
@media(max-width:992px){.wrap{padding:0 28px;}}
@media(max-width:480px){.wrap{padding:0 18px;}}

.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gray);text-transform:uppercase;font-weight:500;}
.display{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;}

/* ============================================================
   HEADER
   ============================================================ */
#site-header{
  position:sticky;top:0;z-index:400;
  background:rgba(247,246,242,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  height:var(--header-h);
}
.header-row{
  height:var(--header-h);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}
.header-left,.header-right{display:flex;align-items:center;gap:20px;}
.header-right{justify-content:flex-end;}
.icon-btn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  position:relative;transition:opacity .25s var(--ease);
}
.icon-btn:hover{opacity:.55;}
.icon-btn svg{width:19px;height:19px;stroke:var(--black);fill:none;stroke-width:1.4;}
.count-badge{
  position:absolute;top:-2px;right:-4px;
  background:var(--black);color:var(--white);
  font-size:9px;width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:600;
}
.count-badge.hide{display:none;}
.logo-block{display:flex;flex-direction:column;align-items:center;line-height:1;}
.logo-word{
  font-family:var(--serif);font-size:28px;letter-spacing:.14em;
  font-weight:500;
}
.logo-bloom{width:14px;height:14px;margin-top:5px;opacity:.85;}
@media(max-width:768px){
  .logo-word{font-size:21px;}
  .header-left .icon-btn:nth-child(2){display:none;}
}

/* ============================================================
   HAMBURGER SIDE MENU
   ============================================================ */
#menu-panel{
  position:fixed;inset:0 auto 0 0;
  width:min(420px,88vw);height:100%;
  background:var(--white);
  transform:translateX(-102%);
  transition:transform .5s var(--ease);
  z-index:600;
  display:flex;flex-direction:column;
  padding:28px 40px;
  overflow-y:auto;
}
#menu-panel.open{transform:translateX(0);}
#menu-scrim{
  position:fixed;inset:0;background:rgba(17,17,17,.35);
  opacity:0;pointer-events:none;transition:opacity .5s var(--ease);z-index:590;
}
#menu-scrim.open{opacity:1;pointer-events:auto;}
.menu-top{display:flex;justify-content:flex-end;margin-bottom:40px;}
.menu-close{width:30px;height:30px;position:relative;}
.menu-close::before,.menu-close::after{
  content:'';position:absolute;left:4px;right:4px;top:50%;height:1px;background:var(--black);
}
.menu-close::before{transform:rotate(45deg);}
.menu-close::after{transform:rotate(-45deg);}
.menu-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:36px;}
.menu-nav button{
  font-family:var(--serif);font-size:26px;padding:9px 0;
  border-bottom:1px solid transparent;transition:opacity .2s;
}
.menu-nav button:hover{opacity:.5;}
.menu-sub{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:28px;}
.menu-sub button{font-size:13px;letter-spacing:.04em;color:var(--gray);transition:color .2s;}
.menu-sub button:hover{color:var(--black);}
.menu-lang{display:flex;gap:16px;margin-top:auto;padding-top:28px;border-top:1px solid var(--line);}
.menu-lang button{font-size:12px;letter-spacing:.08em;color:var(--gray);}
.menu-lang button.active{color:var(--black);font-weight:600;text-decoration:underline;text-underline-offset:4px;}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;height:88vh;min-height:560px;max-height:840px;
  overflow:hidden;
}
.hero-media{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.08), transparent 55%),
    linear-gradient(135deg,#3c3630 0%, #5a5044 35%, #8a7860 62%, #c9b89a 100%);
}
.hero-media::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.28) 100%);
}
.hero-content{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:56px 48px 44px;
}
.hero-brand{
  font-family:var(--serif);color:var(--white);
  font-size:clamp(52px,9vw,120px);
  letter-spacing:.05em;line-height:.9;
}
.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-season{color:var(--white);font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.9;}
.hero-cta{
  color:var(--white);font-size:13px;letter-spacing:.06em;
  border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:3px;
  transition:opacity .25s;
}
.hero-cta:hover{opacity:.6;}
@media(max-width:768px){
  .hero{height:76vh;}
  .hero-content{padding:32px 22px 30px;}
}

/* ============================================================
   SECTION HEADINGS
   ============================================================ */
.section{padding:90px 0;}
.section-tight{padding:60px 0;}
.section-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:40px;gap:20px;flex-wrap:wrap;
}
.section-title{font-family:var(--serif);font-size:clamp(26px,3vw,38px);}
.section-link{font-size:12px;letter-spacing:.06em;color:var(--black);border-bottom:1px solid var(--black);padding-bottom:2px;white-space:nowrap;}
.section-link:hover{opacity:.55;}

/* ============================================================
   PRODUCT GRID / CARD
   ============================================================ */
.grid{display:grid;gap:28px 24px;grid-template-columns:repeat(4,1fr);}
@media(max-width:992px){.grid{grid-template-columns:repeat(3,1fr);gap:22px 18px;}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:26px 14px;}}

.grid.editorial{grid-template-columns:repeat(4,1fr);}
.grid.editorial .card.span2{grid-column:span 2;}
.grid.editorial .card.tall .card-media{aspect-ratio:3/4.3;}
@media(max-width:640px){.grid.editorial .card.span2{grid-column:span 2;}}

.card{position:relative;}
.card-media{
  position:relative;aspect-ratio:3/4;overflow:hidden;
  background:var(--light-gray);cursor:pointer;
}
.card-media img,.ph{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);}
.card-media:hover .ph{transform:scale(1.045);}
.card-tag{
  position:absolute;top:12px;left:12px;z-index:2;
  font-size:10px;letter-spacing:.1em;background:var(--white);
  padding:4px 9px;color:var(--black);
}
.card-tag.sale{background:var(--black);color:var(--white);}
.wish-btn{
  position:absolute;top:10px;right:10px;z-index:2;
  width:30px;height:30px;background:rgba(255,255,255,.85);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.wish-btn:hover{transform:scale(1.08);}
.wish-btn svg{width:15px;height:15px;stroke:var(--black);fill:none;stroke-width:1.5;}
.wish-btn.active svg{fill:var(--black);}
.qv-btn{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  background:var(--white);text-align:center;padding:11px;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  transform:translateY(100%);transition:transform .35s var(--ease);
}
.card-media:hover .qv-btn{transform:translateY(0);}
.card-info{padding-top:13px;display:flex;flex-direction:column;gap:3px;}
.card-name{font-size:13.5px;font-weight:500;}
.card-cat{font-size:11.5px;color:var(--gray);}
.card-price{font-size:13px;margin-top:2px;display:flex;gap:8px;}
.card-price .old{color:var(--gray);text-decoration:line-through;}

.ph{position:relative;overflow:hidden;}

/* ============================================================
   TABS / FILTER BAR
   ============================================================ */
.tabbar{
  display:flex;gap:26px;overflow-x:auto;padding-bottom:14px;margin-bottom:26px;
  border-bottom:1px solid var(--line);scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tab{
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);
  white-space:nowrap;padding-bottom:14px;margin-bottom:-15px;border-bottom:2px solid transparent;
  transition:color .2s;
}
.tab.active,.tab:hover{color:var(--black);}
.tab.active{border-bottom-color:var(--black);}

.filter-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:30px;flex-wrap:wrap;gap:14px;
}
.filter-btns{display:flex;gap:10px;flex-wrap:wrap;}
.filter-chip{
  font-size:11.5px;letter-spacing:.05em;border:1px solid var(--line);
  padding:8px 16px;transition:all .2s;
}
.filter-chip:hover,.filter-chip.active{border-color:var(--black);background:var(--black);color:var(--white);}
.sort-select{
  border:1px solid var(--line);background:var(--white);
  padding:8px 14px;font-size:11.5px;letter-spacing:.04em;
}
.results-count{font-size:11.5px;color:var(--gray);}
.no-results{padding:80px 0;text-align:center;}
.no-results p{font-family:var(--serif);font-size:22px;margin-bottom:8px;}
.no-results span{font-size:13px;color:var(--gray);}

/* ============================================================
   PROMO / EDITORIAL SPLIT BLOCKS
   ============================================================ */
.promo-split{display:grid;grid-template-columns:1.15fr .85fr;gap:2px;background:var(--line);}
.promo-media{aspect-ratio:4/5;background:var(--light-gray);}
.promo-panel{
  background:var(--white);display:flex;flex-direction:column;justify-content:center;
  padding:56px;gap:22px;
}
.promo-panel .section-title{font-size:clamp(24px,2.6vw,34px);}
.promo-panel p{font-size:14.5px;color:var(--gray);max-width:36ch;line-height:1.6;}
.btn-line{
  align-self:flex-start;font-size:12px;letter-spacing:.06em;
  border-bottom:1px solid var(--black);padding-bottom:3px;
}
.btn-line:hover{opacity:.55;}
@media(max-width:768px){
  .promo-split{grid-template-columns:1fr;}
  .promo-panel{padding:36px 22px;}
}

/* ============================================================
   ACCESSORIES DARK BLOCK
   ============================================================ */
.acc-block{background:var(--black);color:var(--white);padding:86px 0;}
.acc-block .section-title{color:var(--white);}
.acc-block .section-link{color:var(--white);border-bottom-color:var(--white);}
.acc-block .card-media{background:#1c1c1c;}
.acc-block .card-name{color:var(--white);}
.acc-block .card-cat,.acc-block .card-price{color:#9c9c9c;}
.acc-block .wish-btn{background:rgba(255,255,255,.12);}
.acc-block .wish-btn svg{stroke:var(--white);}
.acc-block .card-tag{background:var(--white);}

/* ============================================================
   ABOUT
   ============================================================ */
.about{text-align:center;padding:110px 0;max-width:720px;margin:0 auto;}
.about .eyebrow{margin-bottom:18px;}
.about h2{font-family:var(--serif);font-size:clamp(30px,4vw,46px);margin-bottom:22px;}
.about p{color:var(--gray);font-size:15.5px;line-height:1.75;}

/* ============================================================
   FOOTER
   ============================================================ */
footer{border-top:1px solid var(--line);padding:70px 0 34px;}
.footer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;margin-bottom:70px;}
.footer-col h4{font-size:11px;letter-spacing:.1em;color:var(--gray);margin-bottom:16px;text-transform:uppercase;}
.footer-col a,.footer-col button,.footer-col span{display:block;font-size:13.5px;margin-bottom:10px;color:var(--black);text-align:left;width:100%;}
.footer-col a:hover,.footer-col button:hover{opacity:.55;}
.footer-bottom{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:30px;border-top:1px solid var(--line);flex-wrap:wrap;gap:14px;
}
.footer-logo{font-family:var(--serif);font-size:30px;}
.footer-copy{font-size:11.5px;color:var(--gray);}
@media(max-width:768px){
  .footer-grid{grid-template-columns:repeat(2,1fr);gap:36px 20px;}
}

/* ============================================================
   PRODUCT PAGE
   ============================================================ */
.pdp{padding:44px 0 100px;}
.pdp-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;}
.pdp-gallery{display:flex;flex-direction:column;gap:12px;}
.pdp-gallery .ph{aspect-ratio:3/4;background:var(--light-gray);width:100%;height:auto;flex-shrink:0;}
.pdp-info{padding-top:10px;}
.crumb{font-size:11.5px;color:var(--gray);margin-bottom:22px;}
.back-btn{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;letter-spacing:.03em;color:var(--gray);
  margin-bottom:22px;transition:color .2s;
}
.back-btn:hover{color:var(--black);}
.back-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;}
.crumb button:hover{color:var(--black);}
.pdp-name{font-family:var(--serif);font-size:clamp(26px,2.6vw,34px);margin-bottom:8px;}
.pdp-cat{font-size:12.5px;color:var(--gray);margin-bottom:16px;}
.pdp-price{font-size:18px;margin-bottom:26px;display:flex;gap:10px;}
.pdp-price .old{color:var(--gray);text-decoration:line-through;font-size:15px;}
.pdp-block{padding:20px 0;border-top:1px solid var(--line);}
.pdp-block-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin-bottom:12px;}
.swatches{display:flex;gap:10px;}
.swatch{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);cursor:pointer;}
.size-row{display:flex;gap:9px;flex-wrap:wrap;}
.size-btn{
  min-width:46px;height:44px;padding:0 10px;border:1px solid var(--line);
  font-size:12.5px;transition:all .2s;
}
.size-btn:hover{border-color:var(--black);}
.size-btn.active{background:var(--black);color:var(--white);border-color:var(--black);}
.size-warn{font-size:12px;color:#B3382C;margin-top:10px;display:none;}
.size-warn.show{display:block;}
.btn-primary{
  width:100%;background:var(--black);color:var(--white);
  padding:16px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
  margin-top:8px;transition:opacity .25s;
}
.btn-primary:hover{opacity:.82;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{
  width:100%;border:1px solid var(--line);padding:16px;
  font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:border-color .2s;
}
.btn-ghost:hover{border-color:var(--black);}
.btn-ghost svg{width:15px;height:15px;stroke:var(--black);fill:none;stroke-width:1.5;}
.btn-ghost.active svg{fill:var(--black);}
.accordion-item{border-top:1px solid var(--line);}
.accordion-item:last-child{border-bottom:1px solid var(--line);}
.accordion-head{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:17px 0;font-size:13px;letter-spacing:.03em;
}
.accordion-plus{position:relative;width:11px;height:11px;flex-shrink:0;}
.accordion-plus::before,.accordion-plus::after{content:'';position:absolute;background:var(--black);}
.accordion-plus::before{left:0;right:0;top:50%;height:1px;transform:translateY(-50%);}
.accordion-plus::after{top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);transition:opacity .2s;}
.accordion-item.open .accordion-plus::after{opacity:0;}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .35s var(--ease);}
.accordion-item.open .accordion-body{max-height:260px;}
.accordion-body p{font-size:13px;color:var(--gray);line-height:1.7;padding-bottom:18px;}
@media(max-width:768px){
  .pdp-grid{grid-template-columns:1fr;gap:30px;}
}

/* ============================================================
   MODAL / QUICK VIEW
   ============================================================ */
.modal-scrim{
  position:fixed;inset:0;background:rgba(17,17,17,.4);
  opacity:0;pointer-events:none;transition:opacity .35s;z-index:700;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal-scrim.open{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--white);width:min(820px,100%);max-height:88vh;overflow:auto;
  display:grid;grid-template-columns:1fr 1fr;
  transform:translateY(16px);transition:transform .35s var(--ease);position:relative;
}
.modal-scrim.open .modal-box{transform:translateY(0);}
.modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;z-index:3;}
.modal-close::before,.modal-close::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:1px;background:var(--black);}
.modal-close::before{transform:rotate(45deg);}
.modal-close::after{transform:rotate(-45deg);}
.modal-media{aspect-ratio:3/4;background:var(--light-gray);}
.modal-info{padding:40px 36px;display:flex;flex-direction:column;}
@media(max-width:640px){
  .modal-box{grid-template-columns:1fr;}
  .modal-media{aspect-ratio:1/1;}
  .modal-info{padding:28px 22px;}
}

/* ============================================================
   CART DRAWER
   ============================================================ */
#cart-panel{
  position:fixed;inset:0 0 0 auto;width:min(440px,92vw);height:100%;
  background:var(--white);transform:translateX(102%);transition:transform .5s var(--ease);
  z-index:600;display:flex;flex-direction:column;
}
#cart-panel.open{transform:translateX(0);}
.cart-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:26px 30px;border-bottom:1px solid var(--line);
}
.cart-head h3{font-family:var(--serif);font-size:20px;}
.cart-items{flex:1;overflow-y:auto;padding:10px 30px;}
.cart-line{display:grid;grid-template-columns:74px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);}
.cart-line img,.cart-line .ph{width:74px;height:96px;object-fit:cover;background:var(--light-gray);}
.cart-line-name{font-size:13px;font-weight:500;margin-bottom:3px;}
.cart-line-meta{font-size:11.5px;color:var(--gray);margin-bottom:10px;}
.cart-line-bottom{display:flex;justify-content:space-between;align-items:center;}
.qty-stepper{display:flex;align-items:center;border:1px solid var(--line);}
.qty-stepper button{width:26px;height:26px;font-size:13px;}
.qty-stepper span{min-width:22px;text-align:center;font-size:12px;}
.cart-remove{font-size:11px;color:var(--gray);text-decoration:underline;text-underline-offset:3px;}
.cart-remove:hover{color:var(--black);}
.cart-line-price{font-size:12.5px;}
.cart-empty{padding:60px 0;text-align:center;}
.cart-empty p{font-family:var(--serif);font-size:19px;margin-bottom:14px;}
.cart-foot{padding:24px 30px 30px;border-top:1px solid var(--line);}
.cart-sums{font-size:13px;display:flex;justify-content:space-between;margin-bottom:9px;color:var(--gray);}
.cart-sums.total{color:var(--black);font-weight:600;font-size:14.5px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line);}
.cart-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.wa-btn{
  background:#25D366;color:#fff;padding:14px;text-align:center;
  font-size:12.5px;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .2s;
}
.wa-btn:hover{opacity:.85;}

/* ============================================================
   SEARCH OVERLAY
   ============================================================ */
#search-panel{
  position:fixed;inset:0;background:var(--bg);z-index:650;
  transform:translateY(-101%);transition:transform .45s var(--ease);
  overflow-y:auto;
}
#search-panel.open{transform:translateY(0);}
.search-top{
  display:flex;align-items:center;gap:18px;padding:26px 48px;border-bottom:1px solid var(--line);
}
.search-input{
  flex:1;background:none;border:none;font-family:var(--serif);font-size:clamp(22px,4vw,34px);
  outline:none;
}
.search-input::placeholder{color:var(--gray);opacity:.5;}
.search-body{padding:44px 48px;}
@media(max-width:640px){.search-top{padding:20px 22px;}.search-body{padding:30px 22px;}}

/* ============================================================
   CHECKOUT / ROUTES
   ============================================================ */
.route-narrow{max-width:640px;margin:0 auto;padding:60px 0 110px;}
.page-title{font-family:var(--serif);font-size:clamp(26px,3vw,36px);margin-bottom:36px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;letter-spacing:.05em;color:var(--gray);text-transform:uppercase;}
.field input,.field select{
  border:1px solid var(--line);background:var(--white);padding:13px 14px;font-size:14px;
}
.field input:focus,.field select:focus{border-color:var(--black);outline:none;}
.field.error input{border-color:#B3382C;}
.field-err{font-size:11.5px;color:#B3382C;display:none;}
.field.error .field-err{display:block;}
.radio-group{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
.radio-chip{border:1px solid var(--line);padding:13px 18px;font-size:13px;flex:1;text-align:center;min-width:130px;transition:all .2s;}
.radio-chip.active{border-color:var(--black);background:var(--black);color:var(--white);}
.co-summary{background:var(--white);border:1px solid var(--line);padding:22px;margin:26px 0;}
.co-summary-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--gray);}
.co-summary-line.total{color:var(--black);font-weight:600;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:14.5px;}
.confirm-box{text-align:center;padding:60px 0;}
.confirm-box .check{
  width:58px;height:58px;border-radius:50%;border:1px solid var(--black);
  display:flex;align-items:center;justify-content:center;margin:0 auto 26px;
}
.confirm-box h2{font-family:var(--serif);font-size:28px;margin-bottom:10px;}
.confirm-box p{color:var(--gray);font-size:14px;margin-bottom:4px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}

/* ============================================================
   REVEAL ANIMATION
   ============================================================ */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}

#app{animation:appIn .5s var(--ease);}
@keyframes appIn{from{opacity:0;}to{opacity:1;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important;}
}
</style>
</head>

const PRODUCTS = buildProducts();
function byId(id){ return PRODUCTS.find(p=>p.id===Number(id)); }
function inCategory(slug){
  if(slug==="new") return PRODUCTS.filter(p=>p.isNew);
  if(slug==="sale") return PRODUCTS.filter(p=>p.isSale);
  if(slug==="women"||slug==="men"||slug==="accessories") return PRODUCTS.filter(p=>p.cat===slug);
  return PRODUCTS.filter(p=>p.group===slug || p.cat===slug);
}
function fmt(n){ return n.toLocaleString('en-US').replace(/,/g,' ') + " ₸"; }

function updateCounts(){

function placeholder(product, extraClass){
  const imgUrl = PRODUCT_IMAGES[product.name];
  const gradStyle = grad(product.cat,product.seed);
  if(imgUrl){
    // Реальное фото задано в PRODUCT_IMAGES: показываем его.
    // Если ссылка окажется битой — картинка спрячется, и будет виден градиент-заглушка позади неё.
    return `<div class="ph ${extraClass||''}" style="background:${gradStyle};padding:0;">
      <img src="${imgUrl}" alt="${product.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.style.display='none';">
    </div>`;
  }
  return `<div class="ph ${extraClass||''}" style="background:${gradStyle}" role="img" aria-label="${product.name}"></div>`;
}

function renderCatalogResults(slug, filter, sort){
  let items = inCategory(slug);

  if(sort==='new') items = [...items].sort((a,b)=>b.isNew-a.isNew);
  if(sort==='lowhigh') items = [...items].sort((a,b)=>a.price-b.price);
  if(sort==='highlow') items = [...items].sort((a,b)=>b.price-a.price);
  const el = document.getElementById('catalogResults');
  if(!el) return;
  if(items.length===0){
    el.innerHTML = `<div class="no-results"><p>${t('noResults')}</p><span>${t('searchHint')}</span></div>`;
    return;
  }
  el.innerHTML = `<div class="results-count" style="margin-bottom:18px;">${items.length} items</div>` + grid(items);

function cartSubtotal(){ return STATE.cart.reduce((s,l)=>s + byId(l.id).price*l.qty, 0); }
function addToCart(id,size){
  const existing = STATE.cart.find(l=>l.id===id && l.size===size);
  if(existing) existing.qty++;
  else STATE.cart.push({id,size,qty:1});
  saveCart(); renderCartPanel();
}
function changeQty(idx, delta){
  STATE.cart[idx].qty += delta;
  if(STATE.cart[idx].qty<=0) STATE.cart.splice(idx,1);
  saveCart(); renderCartPanel();
  if(location.hash==='#/checkout') router();
}

      </button>
    </div>`;
}

/* ROUTER */
function router(){
  const app = document.getElementById('app');
  const hash = location.hash || '#/';
  const parts = hash.replace('#/','').split('/').filter(Boolean);
  window.scrollTo({top:0,behavior:'instant'});
  closeAllOverlays();

  if(STATE.skipStackPush){
    STATE.skipStackPush = false;
  } else if(STATE.navStack[STATE.navStack.length-1] !== hash){
    STATE.navStack.push(hash);
  }

  if(parts.length===0){ app.innerHTML = pageHome(); }
  else if(parts[0]==='catalog'){ app.innerHTML = pageCatalog(parts[1]||'new'); renderCatalogResults(parts[1]||'new','all','featured'); }
  else if(parts[0]==='product'){ app.innerHTML = pageProduct(parts[1]); }
  else if(parts[0]==='wishlist'){ app.innerHTML = pageWishlist(); }
  else if(parts[0]==='checkout'){ app.innerHTML = pageCheckout(); }
  else if(parts[0]==='order-confirmed'){ app.innerHTML = pageConfirm(parts[1]); }
  else if(parts[0]==='page'){ app.innerHTML = pageStatic(parts[1]); }
  else { app.innerHTML = pageHome(); }

  bindPageEvents();
  updateCounts();
  requestAnimationFrame(setupReveal);
}
window.addEventListener('hashchange', router);

/* EVENTS — delegated globally so cards never get double-bound on re-render */
function toggleWish(id){
  const idx = STATE.wishlist.indexOf(id);
  if(idx>-1) STATE.wishlist.splice(idx,1); else STATE.wishlist.push(id);
  saveWishlist();
}
document.addEventListener('click', (e)=>{
  const wishEl = e.target.closest('[data-wish]');
  if(wishEl){
    const id = Number(wishEl.dataset.wish);
    toggleWish(id);
    wishEl.classList.toggle('active', STATE.wishlist.includes(id));
    return;
  }
  const qvEl = e.target.closest('[data-qv]');
  if(qvEl){ openQuickView(Number(qvEl.dataset.qv)); return; }
  const navEl = e.target.closest('[data-nav]');
  if(navEl){
    if(document.getElementById('search-panel').contains(navEl)) closeSearch();
    location.hash = '#/'+navEl.dataset.nav;
    return;
  }
  const routeEl = e.target.closest('[data-route]');
  if(routeEl){
    if(document.getElementById('search-panel').contains(routeEl)) closeSearch();
    location.hash = '#'+routeEl.dataset.route;
    return;
  }
  const backEl = e.target.closest('[data-back]');
  if(backEl){ goBack(); return; }
});
function goBack(){
  if(STATE.navStack.length > 1){
    STATE.navStack.pop();
    const prev = STATE.navStack[STATE.navStack.length-1];
    STATE.skipStackPush = true;
    location.hash = prev;
  } else {
    location.hash = '#/';
  }
}

function bindPageEvents(){
  const app = document.getElementById('app');

  const chips = app.querySelectorAll('.filter-chip');
  const sortSel = app.querySelector('#sortSelect');
  const slugMatch = (location.hash.match(/#\/catalog\/([\w-]+)/)||[])[1] || 'new';
  function refresh(){
    const activeChip = app.querySelector('.filter-chip.active');
    const activeFilter = activeChip ? activeChip.dataset.filter : 'all';
    renderCatalogResults(slugMatch, activeFilter, sortSel?sortSel.value:'featured');
  }
  chips.forEach(c=>c.addEventListener('click',()=>{ chips.forEach(x=>x.classList.remove('active')); c.classList.add('active'); refresh(); }));
  if(sortSel) sortSel.addEventListener('change', refresh);

  const sizeButtons = app.querySelectorAll('#pdpSizes .size-btn');
  let selectedSize = null;
  sizeButtons.forEach(b=>b.addEventListener('click',()=>{
    sizeButtons.forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); selectedSize=b.dataset.size;
    const warn = document.getElementById('sizeWarn'); if(warn) warn.classList.remove('show');
  }));
  const addBtn = app.querySelector('#pdpAddToBag');
  if(addBtn){
    const pid = Number((location.hash.match(/#\/product\/(\d+)/)||[])[1]);
    addBtn.addEventListener('click',()=>{
      if(!selectedSize){ document.getElementById('sizeWarn').classList.add('show'); return; }
      addToCart(pid, selectedSize);
      openCart();
    });
  }
  const pdpWish = app.querySelector('#pdpWishBtn');
  if(pdpWish){
    const pid = Number((location.hash.match(/#\/product\/(\d+)/)||[])[1]);
    pdpWish.addEventListener('click',()=>{
      toggleWish(pid);
      pdpWish.classList.toggle('active', STATE.wishlist.includes(pid));
    });
  }
  app.querySelectorAll('.accordion-head').forEach(h=>{
    h.addEventListener('click', ()=>h.parentElement.classList.toggle('open'));
  });

  const form = app.querySelector('#checkoutForm');
  if(form){
    app.querySelectorAll('[data-delivery]').forEach(b=>b.addEventListener('click',()=>{
      app.querySelectorAll('[data-delivery]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); STATE.checkoutForm.deliveryMethod=b.dataset.delivery;
      updateCheckoutTotal();
    }));
    app.querySelectorAll('[data-payment]').forEach(b=>b.addEventListener('click',()=>{
      app.querySelectorAll('[data-payment]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); STATE.checkoutForm.payment=b.dataset.payment;
    }));
    form.addEventListener('submit', onCheckoutSubmit);
  }
}
function updateCheckoutTotal(){
  const totalEl = document.getElementById('coTotal');
  if(!totalEl) return;
  const subtotal = cartSubtotal();
  const fee = STATE.checkoutForm.deliveryMethod==='pickup'?0:2000;
  totalEl.textContent = fmt(subtotal+fee);
}

function onCheckoutSubmit(e){
  e.preventDefault();
  const form = e.target;
  const required = ['firstName','lastName','phone','email','city','address'];
  let valid = true;
  const data = {};
  required.forEach(name=>{
    const input = form.elements[name];
    const wrap = form.querySelector(`[data-field="${name}"]`);
    const val = input.value.trim();
    data[name]=val;
    if(!val){ wrap.classList.add('error'); valid=false; } else wrap.classList.remove('error');
  });
  if(!valid) return;

  const subtotal = cartSubtotal();
  const fee = STATE.checkoutForm.deliveryMethod==='pickup'?0:2000;
  const orderNum = 'ALB-' + Math.floor(1000+Math.random()*9000);
  const order = {
    number: orderNum,
    customer: data.firstName+' '+data.lastName,
    phone: data.phone, email: data.email,
    address: data.city+', '+data.address,
    products: STATE.cart.map(l=>({name:byId(l.id).name, size:l.size, qty:l.qty, price:byId(l.id).price})),
    subtotal, delivery:fee, total: subtotal+fee,
    date: new Date().toISOString(), status:'pending',
    deliveryMethod: STATE.checkoutForm.deliveryMethod, payment: STATE.checkoutForm.payment
  };
  STATE.orders.push(order); saveOrders();
  STATE.cart = []; saveCart(); renderCartPanel();
  location.hash = '#/order-confirmed/'+orderNum;
}

/* QUICK VIEW */
function openQuickView(id){
  const p = byId(id);
  const content = document.getElementById('qvContent');
  content.innerHTML = `
    <div class="modal-media">${placeholder(p)}</div>
    <div class="modal-info">
      <div class="pdp-cat">${p.group}</div>
      <h2 class="pdp-name" style="font-size:22px;">${p.name}</h2>
      <div class="pdp-price">${p.oldPrice?`<span class="old">${fmt(p.oldPrice)}</span>`:''}<span>${fmt(p.price)}</span></div>
      <div class="pdp-block" style="border-top:none;padding-top:0;">
        <div class="pdp-block-label">${t('size')}</div>
        <div class="size-row" id="qvSizes">${p.sizes.map(s=>`<button class="size-btn" data-size="${s}">${s}</button>`).join('')}</div>
        <div class="size-warn" id="qvSizeWarn">${t('selectSize')}</div>
      </div>
      <button class="btn-primary" id="qvAddBtn">${t('addToBag')}</button>
      <button data-route="/product/${p.id}" class="btn-line" style="margin-top:14px;display:inline-block;">${t('viewFull')} →</button>
    </div>`;
  let selSize=null;
  content.querySelectorAll('#qvSizes .size-btn').forEach(b=>b.addEventListener('click',()=>{
    content.querySelectorAll('#qvSizes .size-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); selSize=b.dataset.size;
    document.getElementById('qvSizeWarn').classList.remove('show');
  }));
  content.querySelector('#qvAddBtn').addEventListener('click',()=>{
    if(!selSize){ document.getElementById('qvSizeWarn').classList.add('show'); return; }
    addToCart(p.id, selSize);
    closeQuickView();
    openCart();
  });
  document.getElementById('qv-scrim').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeQuickView(){ document.getElementById('qv-scrim').classList.remove('open'); document.body.style.overflow=''; }

/* PANELS */
function openCart(){ document.getElementById('cart-panel').classList.add('open'); document.getElementById('cart-scrim').classList.add('open'); document.body.style.overflow='hidden'; renderCartPanel(); }
function closeCart(){ document.getElementById('cart-panel').classList.remove('open'); document.getElementById('cart-scrim').classList.remove('open'); document.body.style.overflow=''; }
function openMenu(){ document.getElementById('menu-panel').classList.add('open'); document.getElementById('menu-scrim').classList.add('open'); document.body.style.overflow='hidden'; }
function closeMenu(){ document.getElementById('menu-panel').classList.remove('open'); document.getElementById('menu-scrim').classList.remove('open'); document.body.style.overflow=''; }
function openSearch(){ document.getElementById('search-panel').classList.add('open'); setTimeout(()=>document.getElementById('searchInput').focus(),400); document.body.style.overflow='hidden'; }
function closeSearch(){ document.getElementById('search-panel').classList.remove('open'); document.body.style.overflow=''; document.getElementById('searchInput').value=''; document.getElementById('searchResults').innerHTML=''; }
function closeAllOverlays(){ closeCart(); closeMenu(); closeSearch(); closeQuickView(); }

function renderMenu(){
  const cats = ['new','women','men','outerwear','tops','bottoms','dresses','knitwear','accessories','shoes','sale'];
  document.getElementById('menuNav').innerHTML = cats.map(c=>`<button data-route="/catalog/${c}" class="menu-nav-link">${c.toUpperCase()}</button>`).join('');
  document.getElementById('menuSub').innerHTML = `
    <button data-route="/page/about">${t('menuAbout')}</button>
    <button data-route="/page/contact">${t('menuContact')}</button>
    <button data-route="/page/delivery">${t('menuDelivery')}</button>
    <button data-route="/page/faq">${t('menuFaq')}</button>
    <button data-route="/page/sizeguide">${t('menuSizeGuide')}</button>`;
  document.getElementById('menuLang').innerHTML = ['en','ru','kz'].map(l=>`<button data-lang="${l}" class="${STATE.lang===l?'active':''}">${l.toUpperCase()}</button>`).join('');
  document.getElementById('menuNav').querySelectorAll('button').forEach(a=>a.addEventListener('click', closeMenu));
  document.getElementById('menuSub').querySelectorAll('button').forEach(a=>a.addEventListener('click', closeMenu));
  document.getElementById('menuLang').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    STATE.lang = b.dataset.lang; saveLang(); refreshStaticText(); renderMenu(); router();
  }));
}

function doSearch(query){
  const q = query.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  if(!q){ results.innerHTML=''; return; }
  const found = PRODUCTS.filter(p=> p.name.toLowerCase().includes(q) || p.group.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q));
  if(found.length===0){
    results.innerHTML = `<div class="no-results"><p>${t('noResults')}</p><span>${t('searchHint')}</span></div>`;
    return;
  }
  results.innerHTML = grid(found);
}

/* WHATSAPP */
function buildWhatsAppMessage(){
  let lines = ["Hello ALIBI!", "I would like to place an order:", ""];
  STATE.cart.forEach(l=>{
    const p = byId(l.id);
    lines.push(p.name + " — Size " + l.size + " — x" + l.qty);
  });
  lines.push("", "Total: " + fmt(cartSubtotal()), "", "Name:", "Phone:");
  return encodeURIComponent(lines.join('\n'));
}
function openWhatsAppOrder(){
  if(STATE.cart.length===0) return;
  const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + buildWhatsAppMessage();
  window.open(url, '_blank', 'noopener');
}

/* REVEAL */
let observer;
function setupReveal(){
  document.querySelectorAll('.section, .promo-split, .about, .acc-block').forEach(el=>el.classList.add('reveal'));
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); observer.unobserve(en.target); } });
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
}

/* STATIC TEXT REFRESH */
function refreshStaticText(){
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tph]').forEach(el=>{ el.placeholder = t(el.dataset.tph); });
}

/* GLOBAL BINDINGS */
document.getElementById('hamburgerBtn').addEventListener('click', openMenu);
document.getElementById('menuCloseBtn').addEventListener('click', closeMenu);
document.getElementById('menu-scrim').addEventListener('click', closeMenu);

document.getElementById('cartOpenBtn').addEventListener('click', openCart);
document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
document.getElementById('cart-scrim').addEventListener('click', closeCart);
document.getElementById('cartItems').addEventListener('click',(e)=>{
  const q = e.target.closest('[data-qty]');
  if(q){ changeQty(Number(q.dataset.idx), Number(q.dataset.qty)); return; }
  const r = e.target.closest('[data-remove]');
  if(r){ removeLine(Number(r.dataset.remove)); }
});
document.getElementById('cartFoot').addEventListener('click',(e)=>{
  if(e.target.closest('#cartCheckoutLink')) closeCart();
  if(e.target.closest('#cartWaBtn')){ e.preventDefault(); openWhatsAppOrder(); }
});
document.getElementById('footerWaLink').addEventListener('click',(e)=>{ e.preventDefault(); window.open('https://instagram.com','_blank','noopener'); });

document.getElementById('searchOpenBtn').addEventListener('click', openSearch);
document.getElementById('searchCloseBtn').addEventListener('click', closeSearch);
document.getElementById('searchInput').addEventListener('input', (e)=>doSearch(e.target.value));

document.getElementById('qvCloseBtn').addEventListener('click', closeQuickView);
document.getElementById('qv-scrim').addEventListener('click', (e)=>{ if(e.target.id==='qv-scrim') closeQuickView(); });

document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ closeQuickView(); closeCart(); closeMenu(); closeSearch(); }
});

/* INIT */
saveLang();
refreshStaticText();
renderMenu();
updateCounts();
if(!location.hash) location.hash = '#/';
router();

})();
</script>
</body>
</html>
